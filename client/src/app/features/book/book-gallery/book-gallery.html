<div class="panel">
  @if (current(); as view) {
    <div class="stage">
      <!-- A sold out book's front cover is faded and blurred, like on its card. -->
      <div class="picture" [class.soldout]="!book().inStock && view.kind === 'front'">
        @if (view.image; as image) {
          <img
            class="photo"
            [src]="image.url"
            [alt]="image.alt || view.label + ' – ' + book().title"
            width="300"
            height="400"
          />
        } @else if (view.kind === 'front') {
          <oh-book-cover [book]="book()" [decorative]="true" />
        } @else {
          <div class="ph" role="img" [attr.aria-label]="view.label + ' (דוגמה)'">
            {{ view.placeholder }}
          </div>
        }
      </div>
      @if (!book().inStock && view.kind === 'front') {
        <span class="soldout-label">אזל במלאי</span>
      }
    </div>
  }
</div>

@if (views().length > 1) {
  <div class="thumbs" role="group" aria-label="תמונות הספר">
    @for (view of views(); track view.kind) {
      <button
        type="button"
        class="thumb"
        [class.sel]="view.kind === selected()"
        [attr.aria-pressed]="view.kind === selected()"
        [attr.aria-label]="view.label"
        (click)="select(view.kind)"
      >
        @if (view.image; as image) {
          <img [src]="image.url" alt="" />
        } @else {
          {{ view.label }}
        }
      </button>
    }
  </div>
}
