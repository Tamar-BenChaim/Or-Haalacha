<header class="header">
  <div class="inner container">
    <a class="logo" routerLink="/" aria-label="אור ההלכה – לדף הבית">אור ההלכה</a>
    <nav class="nav" aria-label="ניווט ראשי">
      @for (item of items; track item.section) {
        <a
          routerLink="/"
          [fragment]="item.section"
          [class.active]="activeSection() === item.section"
          [attr.aria-current]="activeSection() === item.section ? 'location' : null"
          >{{ item.label }}</a
        >
      }
    </nav>
    <a
      class="btn cart"
      routerLink="/cart"
      [class.bump]="ui.bumping()"
      [attr.aria-label]="'עגלת קניות, ' + cartCount() + ' פריטים'"
    >
      עגלה ({{ cartCount() }})
    </a>
  </div>
</header>
