<nav aria-label="פירורי לחם">
  <ol class="crumbs">
    @for (crumb of items(); track $index; let last = $last) {
      <li>
        @if (last || !crumb.link) {
          <span aria-current="page">{{ crumb.label }}</span>
        } @else {
          <a [routerLink]="crumb.link">{{ crumb.label }}</a>
          <span class="sep" aria-hidden="true">›</span>
        }
      </li>
    }
  </ol>
</nav>
