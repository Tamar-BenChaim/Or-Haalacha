@if (book().coverImage; as image) {
  <img class="image" [src]="image.url" alt="" width="300" height="400" loading="lazy" />
} @else {
  <div class="cover">
    <span class="cv">
      <span class="cv-logo">אור ההלכה</span>
      <span class="cv-rule"></span>
      <span class="cv-topic">{{ book().topic || book().title }}</span>
      @if (book().volume !== null) {
        <span class="cv-n">חלק {{ book().volume }}</span>
      } @else {
        <span class="cv-n"></span>
      }
    </span>
  </div>
}
