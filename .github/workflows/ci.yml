name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  # Each workspace is checked only once it has a package.json, so the job
  # always reports a status and can be a required check from day one.
  workspace:
    name: workspace (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [client, admin, server]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect workspace
        id: detect
        working-directory: .
        run: |
          if [ -f "${{ matrix.workspace }}/package.json" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No package.json in ${{ matrix.workspace }} yet, skipping."
          fi
      - uses: actions/setup-node@v7
        if: steps.detect.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Install
        if: steps.detect.outputs.found == 'true'
        run: npm ci
      - name: Lint
        if: steps.detect.outputs.found == 'true'
        run: npm run lint --if-present
      - name: Test
        if: steps.detect.outputs.found == 'true'
        run: npm test --if-present
      - name: Build
        if: steps.detect.outputs.found == 'true'
        run: npm run build --if-present
      - name: Audit dependencies
        if: steps.detect.outputs.found == 'true'
        run: npm audit --audit-level=high
